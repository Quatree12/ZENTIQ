<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>ZENTIQ — Your mind. Your momentum.</title>
    <meta name="description" content="ZENTIQ t'accompagne pour retrouver ta motivation et avancer à ton rythme." />

    <!--
      POLICES — phase 4.1.1
      Nunito     : interface
      Montserrat : citations et titres editoriaux

      Cormorant Garamond est retiree de l'application.

      `preconnect` ouvre la connexion avant que le CSS ne soit lu.
      `display=swap` evite tout texte invisible pendant le chargement.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap"
    />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0D1015" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZENTIQ" />

    <style>
      html,
      body {
        margin: 0;
        background: #0d1015;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 18px;
        background: #0d1015;
        font-family: 'Nunito', system-ui, sans-serif;
        color: #e0f0ed;
      }
      #boot-splash .spinner {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid #34445a;
        border-top-color: #72c8c1;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .spinner {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot-splash" role="status" aria-label="Chargement de ZENTIQ">
      <div class="spinner" aria-hidden="true"></div>
    </div>

    <noscript>
      ZENTIQ nécessite JavaScript pour fonctionner. Tes données restent sur ton appareil.
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
